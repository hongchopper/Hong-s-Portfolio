<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홍선미 포트폴리오</title>
<style>
@font-face{font-family:"NanumSquare Neo";font-weight:400;font-display:swap;src:url("fonts/NanumSquareNeoTTF-bRg.woff2") format("woff2")}
@font-face{font-family:"NanumSquare Neo";font-weight:700;font-display:swap;src:url("fonts/NanumSquareNeoTTF-cBd.woff2") format("woff2")}
@font-face{font-family:"NanumSquare Neo";font-weight:800;font-display:swap;src:url("fonts/NanumSquareNeoTTF-dEb.woff2") format("woff2")}
@font-face{font-family:"NanumSquare Neo";font-weight:900;font-display:swap;src:url("fonts/NanumSquareNeoTTF-eHv.woff2") format("woff2")}

/* 레이아웃: 가이드 문서형 3단(왼쪽 내비 · 본문 · 이 페이지 목차). 개성은 형광펜 마킹, '판단 기록' 카드, [확인 필요] 스티커 */
:root{
  --bg:#F8F9F8; --surface:#FFFFFF; --ink:#17201C; --muted:#56625C; --faint:#8A948F;
  --line:#E3E7E4; --accent:#1F9D6B; --accent-ink:#FFFFFF; --accent-soft:#E7F5EE;
  --mark:#FFE07A; --mark-ink:#17201C; --flag:#D9650B; --flag-soft:#FFF0E2;
  --ph:#F0F2F1; --ph-line:#BCC5C0;
  --font:"NanumSquare Neo","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --nav-w:264px; --toc-w:200px; --content:760px;
  --t-xs:12px; --t-sm:13.5px; --t-md:15.5px; --t-lg:19px; --t-xl:26px; --t-2xl:clamp(30px,4.4vw,44px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171D1A; --ink:#E7ECE9; --muted:#A3AEA8; --faint:#76817B;
  --line:#28302C; --accent:#4CC994; --accent-ink:#0E1513; --accent-soft:#15291F;
  --mark:#7A6417; --mark-ink:#FFF6D6; --flag:#FFA45C; --flag-soft:#33230F;
  --ph:#141A17; --ph-line:#3A4540; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171D1A; --ink:#E7ECE9; --muted:#A3AEA8; --faint:#76817B;
  --line:#28302C; --accent:#4CC994; --accent-ink:#0E1513; --accent-soft:#15291F;
  --mark:#7A6417; --mark-ink:#FFF6D6; --flag:#FFA45C; --flag-soft:#33230F;
  --ph:#141A17; --ph-line:#3A4540; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-md);line-height:1.75;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mk{background:linear-gradient(transparent 52%,var(--mark) 52%);color:inherit;padding:0 .1em}

/* 셸 */
.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:28px 20px 40px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
.brand .name{font-weight:900;font-size:21px;letter-spacing:-.02em}
.brand .role{font-size:var(--t-sm);color:var(--muted);line-height:1.5}
.ver{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;font-size:var(--t-xs);font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;letter-spacing:.02em}
.ngroup{display:flex;flex-direction:column;gap:2px}
.ngroup h4{margin:0 0 6px;font-size:var(--t-xs);font-weight:800;color:var(--faint);letter-spacing:.08em}
.nlink{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:var(--t-sm);padding:7px 10px;border-radius:8px;line-height:1.45}
.nlink:hover{background:var(--bg);color:var(--ink)}
.nlink[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:800}
.nlink small{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.nfoot{margin-top:auto;font-size:var(--t-xs);color:var(--faint);line-height:1.6}
.themebtn{font:inherit;font-size:var(--t-xs);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;margin-top:8px}

.topbar{display:none}
.main{display:grid;grid-template-columns:minmax(0,1fr) var(--toc-w);gap:48px;padding-block:44px 96px;padding-inline:clamp(16px,4vw,56px);max-width:calc(var(--content) + var(--toc-w) + 160px)}
.page{min-width:0;display:flex;flex-direction:column;gap:44px}
.toc{position:sticky;top:44px;align-self:start;font-size:var(--t-sm);display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line);padding-left:16px}
.toc b{font-size:var(--t-xs);color:var(--faint);letter-spacing:.08em;margin-bottom:4px}
.toc button{font:inherit;text-align:left;background:none;border:0;padding:3px 0;cursor:pointer;color:var(--muted);line-height:1.5}
.toc button:hover{color:var(--accent)}

/* 페이지 머리 */
.crumb{font-size:var(--t-xs);color:var(--faint);font-weight:700;letter-spacing:.04em}
.phead{display:flex;flex-direction:column;gap:14px}
.phead h1{font-size:var(--t-2xl);font-weight:900;letter-spacing:-.03em}
.lede{font-size:var(--t-lg);color:var(--muted);line-height:1.65;max-width:42em}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.meta div{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.meta dt{font-size:var(--t-xs);color:var(--faint);font-weight:700}
.meta dd{margin:0;font-size:var(--t-sm);font-weight:700;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:var(--t-xs);font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
.tag.ai{color:var(--accent);border-color:var(--accent)}

/* 섹션 */
.sec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:24px}
.sec>h2{font-size:var(--t-xl);font-weight:900;letter-spacing:-.02em;display:flex;gap:12px;align-items:baseline}
.sec>h2 .no{font-size:var(--t-sm);color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
.sec h3{font-size:var(--t-lg);font-weight:800}
.prose{display:flex;flex-direction:column;gap:12px;max-width:42em}
.prose p{color:var(--ink)}
ul.dots{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
ul.dots li::marker{color:var(--accent)}

/* 과정 단계 */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-bottom:20px;position:relative;counter-increment:s}
.steps li::before{content:counter(s,decimal-leading-zero);font-weight:900;font-size:var(--t-sm);color:var(--accent);background:var(--accent-soft);border-radius:10px;height:32px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.steps li::after{content:"";position:absolute;left:21px;top:38px;bottom:4px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps b{display:block;font-weight:800}
.steps span{color:var(--muted);font-size:var(--t-sm)}

/* 판단 기록 카드 */
.decision{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.decision>div{padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.decision>div+div{border-left:1px dashed var(--line);background:var(--accent-soft)}
.decision small{font-size:var(--t-xs);font-weight:800;color:var(--faint);letter-spacing:.04em}
.decision>div+div small{color:var(--accent)}
.decision p{font-weight:700}

/* 결과 · 지표 */
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.out{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.out b{font-size:var(--t-lg);font-weight:900;letter-spacing:-.01em}
.out span{font-size:var(--t-sm);color:var(--muted);line-height:1.6}
.kpi{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.kpi header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);font-size:var(--t-sm);font-weight:800}
.kpi header span{color:var(--faint);font-weight:700;font-size:var(--t-xs)}
.kpi table{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.kpi td{padding:10px 18px;border-top:1px solid var(--line);vertical-align:top}
.kpi tr:first-child td{border-top:0}
.kpi td:first-child{font-weight:800;width:38%}
.kpi td:last-child{color:var(--muted)}

.aibox{display:flex;flex-direction:column;gap:10px;border-radius:14px;padding:18px 20px;background:var(--accent-soft)}
.aibox h3{font-size:var(--t-md);color:var(--accent);font-weight:900}
.aibox ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:var(--t-sm)}

/* 확인 필요 스티커 */
.flag{display:inline-block;font-size:.82em;font-weight:800;color:var(--flag);background:var(--flag-soft);border-radius:6px;padding:0 6px;line-height:1.6;white-space:nowrap}

/* 사진 자리 */
.ph{margin:0;width:100%;max-width:100%;border:1.5px dashed var(--ph-line);border-radius:14px;background:var(--ph);display:grid;place-items:center;text-align:center;padding:16px;color:var(--faint);font-size:var(--t-sm)}
.ph b{display:block;color:var(--muted);font-weight:800}
.ph i{font-style:normal;font-size:var(--t-xs);font-variant-numeric:tabular-nums}
.ph svg{width:28px;height:28px;margin:0 auto 6px;display:block;stroke:var(--faint);fill:none;stroke-width:1.6}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gallery .ph.wide{grid-column:1/-1}

/* 홈 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:32px;align-items:end}
.hero h1{font-size:clamp(30px,4.6vw,50px);font-weight:900;letter-spacing:-.035em;line-height:1.3}
.hero .ph{aspect-ratio:4/5}
.traits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trait{border-top:3px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.trait b{font-weight:900;font-size:var(--t-lg)}
.trait em{font-style:normal;font-size:var(--t-xs);color:var(--faint);font-weight:800;letter-spacing:.06em}
.trait span{font-size:var(--t-sm);color:var(--muted);line-height:1.65}
.manual{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.manual .out b{font-size:var(--t-md)}

/* 케이스 카드 */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 14px 18px;transition:border-color .15s,transform .15s;min-width:0}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ph{aspect-ratio:16/9;padding:8px}
.card .k{font-size:var(--t-xs);color:var(--faint);font-weight:800;font-variant-numeric:tabular-nums}
.card h3{font-size:var(--t-md);font-weight:900;line-height:1.45}
.card p{font-size:var(--t-sm);color:var(--muted);line-height:1.6}

/* 전체 목록 */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:var(--t-sm);font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.list{width:100%;border-collapse:collapse;font-size:var(--t-sm);min-width:620px}
table.list th{text-align:left;font-size:var(--t-xs);color:var(--faint);font-weight:800;padding:10px 16px;border-bottom:1px solid var(--line);letter-spacing:.04em}
table.list td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:top}
table.list tr:first-child td{border-top:0}
table.list td.when{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
table.list a{font-weight:800;text-decoration:none;color:var(--ink)}
table.list a:hover{color:var(--accent)}
table.list .sub{display:block;color:var(--muted);font-size:var(--t-xs);margin-top:2px}

/* 이력 타임라인 */
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.tl>div{position:relative;padding:0 0 22px 22px;display:flex;flex-direction:column;gap:4px}
.tl>div::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl time{font-size:var(--t-xs);color:var(--faint);font-weight:800;font-variant-numeric:tabular-nums}
.tl b{font-weight:900}
.tl span{font-size:var(--t-sm);color:var(--muted)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:24px}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--surface);min-width:0}
.pager a small{color:var(--faint);font-size:var(--t-xs);font-weight:700}
.pager a b{font-weight:800;font-size:var(--t-sm)}
.pager a.next{text-align:right}
.pager a:hover{border-color:var(--accent)}
.note{font-size:var(--t-xs);color:var(--faint)}

@media (max-width:1180px){.main{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar b{font-weight:900}
  .topbar button{font:inherit;font-size:var(--t-sm);font-weight:800;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
  .nav{position:fixed;inset:0 25% 0 0;height:auto;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(10,12,24,0)}
  .nav.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,12,24,.35)}
  .main{padding-block:28px 72px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .ph{max-width:180px}
}
@media (max-width:620px){
  .traits,.cards,.manual,.gallery,.decision,.pager{grid-template-columns:minmax(0,1fr)}
  .decision>div+div{border-left:0;border-top:1px dashed var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="topbar"><b>홍선미</b><button id="menuBtn" type="button" aria-expanded="false" aria-controls="nav">메뉴</button></div>
<div class="shell">
  <nav class="nav" id="nav" aria-label="포트폴리오 메뉴"></nav>
  <div class="main">
    <main class="page" id="page"></main>
    <aside class="toc" id="toc" aria-label="이 페이지 목차"></aside>
  </div>
</div>

<script>
const F = t => `<span class="flag">${t ? '확인 필요 · ' + t : '확인 필요'}</span>`;
const PH_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>';
const ph = (label, ratio = '16/9', cls = '') =>
  `<figure class="ph ${cls}" style="aspect-ratio:${ratio}">` +
  `<div>${PH_ICON}<b>${label}</b><i>사진 자리 · ${ratio.replace('/', ':')}</i></div></figure>`;

/* ───────── 프로젝트 데이터 ───────── */
const P = [
{ id:'ibk', featured:true, cat:['기준·가이드','AI'],
  title:'사람과 AI가 같은 기준으로 쓰는 문구 체계',
  service:'은행 개인·기업 채널 UX 라이팅 가이드', org:'하이유엑스컨설팅 · IBK기업은행',
  when:'2026.03 – 2026.08', role:'현황 분석, 가이드 체계·작성, AI 지침, 검수', team:F('인원'),
  lede:'채널마다 다르게 판단하던 문구를 원칙과 상황별 기준으로 묶고, 실무자가 바로 찾아보는 HTML 가이드로 만들었어요. 같은 원칙을 AI 지침과 예문 데이터로 옮겨 내부 AI도 그 기준으로 문구를 만들고 검수하게 했어요.',
  problem:['같은 상황인데도 화면과 담당자마다 문구가 다르게 쓰이고 있었어요.','기준 문서가 있어도 실무자가 작업 중에 바로 찾아보기 어려웠어요. '+F('현황 분석에서 찾은 대표 사례·건수')],
  decision:{ first:'처음엔 문구 표현을 다듬는 일이라고 봤어요. '+F(), then:'현업 인터뷰와 VOC를 보니 문제는 판단 기준이 사람마다 다르다는 데 있었어요. 그래서 예문집이 아니라 판단 순서를 먼저 정했어요. '+F('본인 표현으로 다듬기') },
  steps:[['현황 분석','현업 인터뷰와 VOC로 채널별 문구 문제를 유형화'],['원칙·보이스앤톤','개인·기업 채널이 함께 쓸 원칙과 말투 기준 정의'],['상황별·유형별 가이드','안내·오류·확인 같은 상황과 버튼·알림 같은 컴포넌트별 작성법'],['독립 실행형 HTML 가이드','설치 없이 열어 검색하고 복사하는 가이드로 개발'],['AI 지침·RAG 예문','같은 원칙을 AI 지침과 예문 데이터로 옮겨 생성·검수에 적용'],['LLM 결과 검수','AI가 만든 문구를 가이드 기준으로 검수하고 지침 보완']],

/* ───────── 내비 · 라우팅 ───────── */
const NAV = [
  ['시작하기', [['home','소개'],['ai','AI와 일하는 방식']]],
  ['대표 케이스', P.filter(p=>p.featured).map(p=>[p.id, p.service.split(' ').slice(0,3).join(' ')])],
  ['프로젝트', [['projects','모든 프로젝트', P.length + SHORT.length]]],
  ['이력', [['career','경력과 이력']]],
];
const SHORTNAME = {ibk:'UX 라이팅 가이드 · AI', heybeagle:'매칭 플랫폼 리뉴얼', monimo:'30명 사용자 조사', egypt:'정부 UI/UX 표준 · AI'};
const nav = document.getElementById('nav');
nav.innerHTML = `<a class="brand" href="#home"><span class="ver">2026.10 초안</span><span class="name">홍선미</span><span class="role">UX·서비스 기획 → 프로덕트</span></a>` +
  NAV.map(([g, items]) => `<div class="ngroup"><h4>${g}</h4>${items.map(([id,label,c]) => `<a class="nlink" href="#${id}">${SHORTNAME[id]||label}${c?`<small>${c}</small>`:''}</a>`).join('')}</div>`).join('') +
  `<div class="nfoot">초안 · 주황색 표시는 채워야 할 곳이에요.<br><button class="themebtn" id="themeBtn" type="button">다크 모드</button></div>`;

const page = document.getElementById('page'), toc = document.getElementById('toc');
function render(){
  const id = (location.hash || '#home').slice(1);
  const proj = P.find(p => p.id === id);
  const html = proj ? projectPage(proj) : (PAGES[id] || PAGES.home)();
  page.innerHTML = html;
  const cur = proj ? id : (PAGES[id] ? id : 'home');
  nav.querySelectorAll('.nlink').forEach(a => { if (a.getAttribute('href') === '#' + cur) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const hs = [...page.querySelectorAll('.sec')];
  toc.innerHTML = hs.length ? '<b>이 페이지</b>' + hs.map(s => `<button type="button" data-to="${s.id}">${s.querySelector('h2').lastChild.textContent}</button>`).join('') : '';
  if (cur === 'projects') bindFilter();
  nav.classList.remove('open'); document.getElementById('menuBtn').setAttribute('aria-expanded','false');
  window.scrollTo(0,0);
}
function bindFilter(){
  const chips = [...document.querySelectorAll('.chip')];
  chips.forEach(ch => ch.addEventListener('click', () => {
    chips.forEach(c => c.setAttribute('aria-pressed', c === ch));
    const cat = ch.dataset.cat;
    document.querySelectorAll('#plist tbody tr').forEach(tr => tr.hidden = !(cat === '전체' || tr.dataset.cats.split(',').includes(cat)));
  }));
}
toc.addEventListener('click', e => { const t = e.target.closest('[data-to]'); if (t) { e.preventDefault(); document.getElementById(t.dataset.to).scrollIntoView({behavior:'smooth'}); } });
window.addEventListener('hashchange', render);
document.getElementById('menuBtn').addEventListener('click', e => { const o = nav.classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', o); });
document.getElementById('themeBtn').addEventListener('click', () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  document.getElementById('themeBtn').textContent = dark ? '다크 모드' : '라이트 모드';
});
document.getElementById('themeBtn').textContent = matchMedia('(prefers-color-scheme: dark)').matches ? '라이트 모드' : '다크 모드';
render();
</script>
</body>
