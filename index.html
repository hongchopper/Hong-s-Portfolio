<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홍선미 · UX·서비스 기획자</title>
<meta name="description" content="흩어진 신호를 모아 팀이 반복해 쓰는 기준으로 바꾸는 UX·서비스 기획자 홍선미의 포트폴리오">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Gowun+Batang&family=Instrument+Serif:ital@0;1&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ───────── 토큰 ─────────
   코발트 블루 + 크림 종이. 개성 요소: 왼쪽 세로 레일, 거대한 콘덴스드 타이포, 기울어진 키워드 알약,
   탑승권(티켓) 모양 판단 기록, 마스킹테이프 붙인 기록 노트, 회전하는 스탬프 */
:root{
  --paper:#F4EEE4; --card:#FBF8F2; --ink:#151A3D; --muted:#575C78; --faint:#85889F;
  --line:#DCD3C3; --blue:#2140C8; --on-blue:#FFFFFF; --blue-soft:#E2E6F8;
  --sand:#E7D8BF; --navy:#10154A; --on-navy:#F4EEE4;
  --flag:#B4410B; --flag-soft:#FCE9D6; --ph:#ECE4D6; --ph-line:#B3A892;
  --device:#1A1C2A; --shadow:0 22px 44px -22px rgba(21,26,61,.45);
  --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Anton","Pretendard Variable",Impact,sans-serif;
  --serif:"Instrument Serif","Gowun Batang",Georgia,serif;
  --script:"Mrs Saint Delafield",cursive;
  --rail:56px; --wrap:1240px; --gut:clamp(16px,4vw,48px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1030; --card:#151A42; --ink:#EEE8DC; --muted:#B0B2C9; --faint:#8285A3;
  --line:#2A3063; --blue:#7D93FF; --on-blue:#0B0F33; --blue-soft:#1C2463;
  --sand:#2B305E; --navy:#060924; --on-navy:#EEE8DC;
  --flag:#FFA45C; --flag-soft:#3A2410; --ph:#161B45; --ph-line:#3F4682;
  --device:#05061A; --shadow:0 22px 44px -22px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1030; --card:#151A42; --ink:#EEE8DC; --muted:#B0B2C9; --faint:#8285A3;
  --line:#2A3063; --blue:#7D93FF; --on-blue:#0B0F33; --blue-soft:#1C2463;
  --sand:#2B305E; --navy:#060924; --on-navy:#EEE8DC;
  --flag:#FFA45C; --flag-soft:#3A2410; --ph:#161B45; --ph-line:#3F4682;
  --device:#05061A; --shadow:0 22px 44px -22px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.25}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--gut)}
.star{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.arrow{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.flag{display:inline-block;font-size:.78em;font-weight:700;color:var(--flag);background:var(--flag-soft);border-radius:6px;padding:0 6px;line-height:1.7;white-space:nowrap;vertical-align:baseline;font-family:var(--sans);letter-spacing:0;text-transform:none}

/* ───────── 세로 레일 ───────── */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);display:flex;flex-direction:column;z-index:40;border-right:1px solid var(--line);background:var(--paper)}
.rail .top{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:22px;color:var(--blue)}
.rail .bot{flex:1;background:var(--blue);color:var(--on-blue);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 0}
.vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;letter-spacing:.18em;white-space:nowrap}
.rail .star{width:26px;height:26px;stroke-width:1.2}
.barcode{width:22px;height:46px;background:repeating-linear-gradient(0deg,currentColor 0 2px,transparent 2px 4px,currentColor 4px 5px,transparent 5px 8px)}

/* ───────── 상단 내비 ───────── */
.main{margin-left:var(--rail);overflow-x:clip}
.topnav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topnav .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:-.01em}
.logo .star{color:var(--blue);width:22px;height:22px}
.logo small{display:block;font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.12em;line-height:1.2}
.links{display:flex;gap:4px;margin-left:auto}
.links a{text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.08em;padding:8px 12px;border-radius:999px;color:var(--muted)}
.links a:hover{color:var(--ink)}
.links a[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
.cta{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:13px;font-weight:700;background:var(--blue);color:var(--on-blue);padding:9px 16px;border-radius:999px}
.iconbtn{font:inherit;font-size:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;flex:none}

/* ───────── 공통 ───────── */
.sec{padding-block:clamp(56px,8vw,104px)}
.shead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--blue);text-transform:uppercase;white-space:nowrap}
.sline{flex:1;height:1px;background:var(--line)}
.more{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--blue);text-decoration:none;white-space:nowrap}
.h2{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.035em;margin-bottom:clamp(28px,4vw,44px)}
.h2 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--blue);letter-spacing:0}
.lede{font-size:clamp(16px,1.6vw,18px);color:var(--muted);line-height:1.75;max-width:40em}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:15px;padding:13px 22px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink);background:none;cursor:pointer;font-family:inherit}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn:hover{transform:translateY(-1px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.tag{font-size:11.5px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:1px 10px;white-space:nowrap}

/* 사진 자리 */
.ph{margin:0;position:relative;width:100%;border:1.5px dashed var(--ph-line);border-radius:18px;overflow:hidden;display:grid;place-items:center;text-align:center;padding:12px;color:var(--faint);font-size:13px;line-height:1.5;
  background:repeating-linear-gradient(135deg,var(--ph) 0 12px,color-mix(in srgb,var(--ph) 70%,var(--ph-line)) 12px 13px)}
.ph b{display:block;color:var(--muted);font-weight:700}
.ph i{font-style:normal;font-size:11.5px}
.ph svg{width:26px;height:26px;margin:0 auto 6px;display:block;stroke:var(--faint);fill:none;stroke-width:1.5}
.ph.has{border:0;padding:0;background:none}
.ph.has img{width:100%;height:100%;object-fit:cover}
.ph.fill{position:absolute;inset:0;border-radius:inherit;border:0;font-size:11px}
.ph.fill svg{width:20px;height:20px}

/* 스크롤 등장 */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

/* ───────── 홈 · 히어로 ───────── */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(32px,5vw,64px) clamp(48px,6vw,80px)}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.16em;color:var(--blue);margin-bottom:18px}
.display{font-family:var(--display);font-weight:400;font-size:clamp(84px,14vw,196px);line-height:.86;letter-spacing:-.005em;color:var(--blue);text-transform:uppercase}
.rule{width:56px;height:3px;background:var(--blue);margin:28px 0 22px}
.hero-k{font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-.035em;line-height:1.4;margin-bottom:14px}
.hero-k em{font-style:normal;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--blue) 28%,transparent) 58%)}
.hero .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.sign{font-family:var(--script);font-size:56px;color:var(--blue);line-height:1;display:block;margin-top:18px;transform:rotate(-4deg);transform-origin:left}
.hero-vis{position:relative;min-height:520px;display:grid;place-items:center}
.hero-vis .sun{position:absolute;top:-10px;right:-6%;width:72%;aspect-ratio:1;border-radius:50%;background:var(--sand)}
.hero-vis .stripes{position:absolute;right:-2%;bottom:6%;width:42%;height:60%;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 9px);border-radius:0 0 0 0}
.hero-vis .arch{position:relative;width:min(78%,380px);border-radius:999px 999px 24px 24px;z-index:1;box-shadow:var(--shadow);border-style:solid;border-color:var(--card);border-width:6px}
.stamp{position:absolute;width:132px;height:132px;color:var(--blue);z-index:2}
.stamp svg{width:100%;height:100%;animation:spin 26s linear infinite}
.stamp text{font-size:10.6px;font-weight:700;letter-spacing:.14em;fill:currentColor;font-family:var(--sans)}
.stamp .core{position:absolute;inset:0;display:grid;place-items:center}
.stamp .core .star{width:30px;height:30px}
.hero-vis .stamp{left:-2%;bottom:14%;background:var(--paper);border-radius:50%}
.floatcard{position:absolute;right:0;bottom:4%;z-index:2;background:var(--navy);color:var(--on-navy);border-radius:16px;padding:14px 18px;max-width:230px;box-shadow:var(--shadow);font-size:13px;line-height:1.55}
.floatcard small{display:block;font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--sand);margin-bottom:4px}
:root[data-theme="dark"] .floatcard small{color:var(--blue)}
@keyframes spin{to{transform:rotate(360deg)}}

/* 흐르는 띠 */
.marquee{background:var(--blue);color:var(--on-blue);overflow:hidden;border-block:1px solid var(--blue)}
.track{display:flex;width:max-content;animation:flow 38s linear infinite}
.track span{display:inline-flex;align-items:center;gap:22px;padding:14px 11px;font-family:var(--display);font-size:clamp(22px,2.6vw,30px);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.track .star{width:22px;height:22px}
@keyframes flow{to{transform:translateX(-50%)}}

/* 키워드 알약 */
.cloudwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:clamp(24px,5vw,64px);align-items:center}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 4px;position:relative}
.pill{font-size:clamp(16px,2vw,23px);font-weight:600;letter-spacing:-.02em;padding:.36em 1em;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);transform:rotate(var(--r,0deg));white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.pill.on{background:var(--blue);color:var(--on-blue);border-color:var(--ink)}
.pill.sand{background:var(--sand)}
.dot{width:26px;height:26px;border-radius:50%;background:var(--blue-soft);align-self:center}
.cloudtxt p+p{margin-top:12px}

/* 일하는 순서 (캡슐) */
.proc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
.cap{border:1.5px solid var(--ink);border-radius:999px;padding:40px 22px;min-height:340px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative;background:var(--card)}
.cap .n{font-family:var(--serif);font-size:22px;color:var(--faint)}
.cap b{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:auto}
.cap span{font-size:13.5px;color:var(--muted);line-height:1.6}
.cap i{font-style:normal;font-size:11.5px;color:var(--faint);margin-top:auto;border-top:1px solid var(--line);padding-top:10px;width:80%}
.cap:last-child{background:linear-gradient(170deg,var(--blue-soft),var(--blue));color:var(--on-blue);border-color:var(--blue)}
.cap:last-child span,.cap:last-child .n,.cap:last-child i{color:inherit;opacity:.85}
.cap:last-child i{border-color:color-mix(in srgb,var(--on-blue) 40%,transparent)}
.cap:not(:last-child)::after{content:"→";position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--blue);font-weight:700;background:var(--paper);line-height:1;padding:2px 0}

/* AI 세 겹 */
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.layer{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transform:rotate(var(--r,0deg))}
.layer:nth-child(2){margin-top:34px}
.layer:nth-child(3){margin-top:68px;background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.layer .n{font-family:var(--display);font-size:46px;line-height:1;color:var(--blue)}
.layer:nth-child(3) .n{color:var(--sand)}
.layer b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.layer span{font-size:14px;line-height:1.65;opacity:.85}
.rules{margin-top:44px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;list-style:none;padding:0}
.rules li{border-top:2px solid var(--ink);padding-top:12px;font-size:14px;font-weight:600;line-height:1.6}
.rules li em{display:block;font-family:var(--serif);font-size:20px;color:var(--blue);font-weight:400}

/* 숫자 띠 */
.stats{background:var(--navy);color:var(--on-navy);border-radius:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:clamp(24px,3vw,40px) 0}
.stat{padding:0 clamp(16px,2.4vw,32px);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat+.stat{border-left:1px solid color-mix(in srgb,var(--on-navy) 18%,transparent)}
.stat .num{font-family:var(--display);font-size:clamp(44px,5.6vw,68px);line-height:1;color:var(--sand)}
:root[data-theme="dark"] .stat .num{color:var(--blue)}
.stat b{font-size:12px;letter-spacing:.14em;font-weight:800}
.stat span{font-size:13px;opacity:.7;line-height:1.5}

/* 프로젝트 타일 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:clamp(14px,2vw,24px)}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles.four{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--ink);min-width:0}
.tile-art{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s ease, box-shadow .25s ease}
.tile:hover .tile-art{transform:translateY(-4px) rotate(-.6deg);box-shadow:var(--shadow)}
.t0 .tile-art{background:var(--blue);color:var(--on-blue)}
.t1 .tile-art{background:var(--sand);color:var(--ink)}
.t2 .tile-art{background:var(--navy);color:var(--on-navy)}
.tile-no{font-family:var(--serif);font-size:20px;opacity:.8}
.tile-head{font-size:clamp(24px,2.4vw,30px);font-weight:900;letter-spacing:-.045em;line-height:1.15;white-space:pre-line}
.tile-hint{position:absolute;right:16px;top:16px;font-size:10.5px;letter-spacing:.06em;border:1px dashed currentColor;border-radius:999px;padding:2px 10px;opacity:.65}
.tile-art .ph.has{position:absolute;inset:0;border-radius:0}
.tile-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.tile-meta .cats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;color:var(--blue)}
.tile-meta h3{font-size:16.5px;font-weight:800;letter-spacing:-.02em;line-height:1.45}
.tile-meta p{font-size:13px;color:var(--muted);grid-column:1}
.go{grid-row:2/4;grid-column:2;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;transition:background .2s}
.tile:hover .go{background:var(--blue);color:var(--on-blue)}

/* 기록 노트 */
.notes{columns:3 280px;column-gap:22px}
.note{break-inside:avoid;display:block;position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:26px 22px 20px;margin:0 0 26px;transform:rotate(var(--r,0deg));box-shadow:0 10px 24px -18px rgba(21,26,61,.5);text-decoration:none;color:var(--ink)}
.note::before{content:"";position:absolute;top:-11px;left:50%;width:86px;height:22px;transform:translateX(-50%) rotate(var(--tr,-3deg));background:color-mix(in srgb,var(--blue) 26%,transparent)}
.note:nth-child(3n+2)::before{background:color-mix(in srgb,var(--sand) 90%,transparent)}
.note .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.note time{font-family:var(--serif);font-size:18px;color:var(--blue)}
.note .tag{color:var(--muted)}
.note h3{font-size:18px;font-weight:800;letter-spacing:-.025em;margin-bottom:6px}
.note p{font-size:14px;color:var(--muted);line-height:1.7}
.note .ph{margin-top:14px;border-radius:4px}
.note .think{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.note .think b{color:var(--blue);font-weight:700;margin-right:6px}
.note .lk{display:inline-flex;align-items:center;gap:4px;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--blue);text-decoration:none}
a.note:hover{border-color:var(--blue)}

/* 함께 일할 때 */
.manual{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;display:flex;gap:16px;align-items:flex-start}
.mcard .ico{width:42px;height:42px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;flex:none}
.mcard .ico .star{width:20px;height:20px}
.mcard b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.mcard span{font-size:14px;color:var(--muted);line-height:1.65}

/* 연락 띠 */
.contact{background:var(--blue);color:var(--on-blue);border-radius:36px 36px 0 0;margin-top:clamp(40px,6vw,80px)}
.contact .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:clamp(24px,4vw,56px);padding-block:clamp(48px,6vw,80px);align-items:center;position:relative}
.contact h2{font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.35;margin-bottom:12px}
.contact p{opacity:.85;font-size:14.5px}
.contact dl{margin:24px 0 0;display:flex;flex-direction:column;gap:12px}
.contact dl div{display:flex;gap:14px;align-items:baseline;font-size:14.5px}
.contact dt{font-size:11px;letter-spacing:.16em;font-weight:800;opacity:.7;width:70px;flex:none}
.contact dd{margin:0;font-weight:600}
.contact dd a{text-decoration:none;border-bottom:1px solid currentColor}
.bigscript{font-family:var(--script);font-size:clamp(76px,11vw,160px);line-height:.9;transform:rotate(-6deg);text-align:center;padding-top:12px}
.contact .stamp{right:var(--gut);top:24px;color:var(--on-blue)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid color-mix(in srgb,var(--on-blue) 25%,transparent);padding-block:18px;font-size:12px;opacity:.8}

/* ───────── 페이지 머리 (WORK · RESUME · LOG) ───────── */
.phero{padding-block:clamp(36px,5vw,64px) clamp(28px,3vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;border-bottom:1px solid var(--line);margin-bottom:clamp(28px,4vw,48px)}
.phero .display{font-size:clamp(84px,13vw,180px)}
.phero .display sup{font-family:var(--serif);font-size:.24em;color:var(--ink);vertical-align:top;margin-left:6px;letter-spacing:0;text-transform:none}
.phero .lede{margin-top:14px}
.phero aside{display:flex;flex-direction:column;align-items:flex-end;gap:12px;text-align:right}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:28px}

.shortlist{margin-top:clamp(48px,6vw,72px)}
.rowlist{border-top:1.5px solid var(--ink)}
.rowlist .r{display:grid;grid-template-columns:140px minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:14.5px;align-items:baseline}
.rowlist .w{font-family:var(--serif);font-size:17px;color:var(--blue)}
.rowlist b{font-weight:800}
.rowlist .s{color:var(--muted);font-size:13px}

/* ───────── 프로젝트 커버 (외주사 포트폴리오 첫 장처럼) ───────── */
.pcover{position:relative;padding-top:clamp(20px,3vw,36px);overflow:hidden}
.pc-top{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;color:var(--muted);letter-spacing:.04em;line-height:1.6}
.pc-top .r{text-align:right}
.pc-mid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:center;min-height:440px;padding-top:24px}
.pc-mid::before{content:"";position:absolute;left:0;right:0;top:52%;height:3px;background:linear-gradient(90deg,transparent,var(--blue) 18%,var(--blue) 82%,transparent);opacity:.75}
.pc-title{position:relative;background:var(--paper);padding-block:8px}
.pc-title h1{font-size:clamp(46px,6.2vw,88px);font-weight:900;letter-spacing:-.06em;line-height:1.08;white-space:pre-line}
.pc-title p{font-size:clamp(15px,1.5vw,18px);font-weight:600;margin-top:16px;color:var(--ink)}
.pc-vis{position:relative;z-index:3;margin-bottom:-240px}
.pc-logo{position:relative;background:var(--paper);padding:8px 0 8px 16px;justify-self:end;width:min(100%,280px)}
.pc-logo .ph{border-radius:12px}
.pc-band{position:relative;background:var(--blue);color:var(--on-blue);border-radius:48px 48px 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:24px;padding:clamp(40px,4vw,56px) clamp(24px,4vw,56px) clamp(48px,5vw,64px);margin-top:36px}
.pc-detail h3{font-size:19px;font-weight:800;letter-spacing:.02em;margin-bottom:14px}
.pc-detail dl{margin:0 0 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:13px}
.pc-detail dt{font-weight:700;opacity:.75;letter-spacing:.08em}
.pc-detail dd{margin:0;font-weight:600}
.pc-detail .chips .tag{padding:6px 16px;font-size:12.5px;font-weight:600}
.pc-sum{grid-column:3}
.pc-sum h2{font-size:clamp(19px,1.9vw,24px);font-weight:800;letter-spacing:-.03em;margin-bottom:14px;line-height:1.4}
.pc-sum p{font-size:14px;line-height:1.8;opacity:.92}

/* 디바이스 목업 */
.phones{position:relative;height:500px}
.phone{position:absolute;width:200px;aspect-ratio:9/19.5;border-radius:34px;background:var(--device);padding:8px;box-shadow:var(--shadow)}
.phone::before{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);width:62px;height:18px;border-radius:999px;background:var(--device);z-index:2}
.phone .scr{position:relative;width:100%;height:100%;border-radius:27px;overflow:hidden;background:var(--card)}
.phone.a{left:4%;top:120px;transform:rotate(-16deg)}
.phone.b{right:6%;top:0;transform:rotate(12deg)}
.browser{border-radius:16px;background:var(--device);padding:0 8px 8px;box-shadow:var(--shadow);transform:rotate(-5deg);margin-top:40px}
.browser .bar{display:flex;gap:6px;padding:12px 6px}
.browser .bar i{width:9px;height:9px;border-radius:50%;background:#4a4d66}
.browser .scr{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--card)}
.sheets{position:relative;height:440px}
.sheet{position:absolute;width:62%;aspect-ratio:3/4;left:19%;top:20px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.sheet.s1{transform:rotate(-12deg) translateX(-24%)}
.sheet.s2{transform:rotate(9deg) translateX(22%) translateY(16px)}
.sheet.s3{transform:rotate(-2deg)}

/* 프로젝트 본문 */
.pbody{max-width:1040px;margin:0 auto;padding-inline:var(--gut);padding-top:clamp(40px,6vw,72px)}
.psec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(20px,3vw,40px);padding-block:clamp(32px,4vw,48px);border-top:1px solid var(--line)}
.psec>header{display:flex;flex-direction:column;gap:2px}
.psec>header .n{font-family:var(--serif);font-style:italic;font-size:44px;line-height:1;color:var(--blue)}
.psec>header h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.psec>header small{font-size:11px;letter-spacing:.16em;color:var(--faint);font-weight:700}
.prose{display:flex;flex-direction:column;gap:12px;font-size:16px;max-width:40em}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-block:8px}
.gallery .wide{grid-column:1/-1}

/* 탑승권 모양 판단 기록 */
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:20px;position:relative;overflow:hidden}
.ticket>div{padding:22px 24px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ticket small{font-size:11px;letter-spacing:.18em;font-weight:800;color:var(--faint)}
.ticket .code{font-family:var(--display);font-size:34px;line-height:1;color:var(--ink)}
.ticket p{font-weight:600;font-size:15px;line-height:1.65}
.ticket .to{background:var(--blue);color:var(--on-blue)}
.ticket .to small,.ticket .to .code{color:inherit;opacity:.85}
.ticket .mid{display:grid;place-items:center;padding:0;border-left:2px dashed var(--line);color:var(--blue);background:var(--card)}
.ticket .mid svg{width:28px;height:28px;fill:currentColor}
.ticket .barcode{position:absolute;right:18px;bottom:14px;color:var(--on-blue);opacity:.35;transform:rotate(90deg)}

.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
.flow li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:6px}
.flow li::before{content:counter(s,decimal-leading-zero);font-family:var(--serif);font-style:italic;font-size:28px;color:var(--blue);line-height:1}
.flow b{font-weight:800;font-size:15.5px;letter-spacing:-.01em}
.flow span{font-size:13.5px;color:var(--muted);line-height:1.6}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.out{background:var(--blue-soft);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:4px}
.out b{font-size:19px;font-weight:900;letter-spacing:-.03em;color:var(--blue)}
.out span{font-size:13.5px;color:var(--muted);line-height:1.6}
.aibox{background:var(--navy);color:var(--on-navy);border-radius:22px;padding:24px 26px}
.aibox h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:10px;color:var(--sand)}
:root[data-theme="dark"] .aibox h3{color:var(--blue)}
.aibox ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.kpi{border:1.5px solid var(--ink);border-radius:18px;overflow:hidden}
.kpi header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1.5px solid var(--ink);font-size:14px;font-weight:800}
.kpi header span{color:var(--faint);font-weight:600;font-size:12px}
.kpi table{width:100%;border-collapse:collapse;font-size:14px}
.kpi td{padding:12px 20px;border-top:1px solid var(--line);vertical-align:top}
.kpi tr:first-child td{border-top:0}
.kpi td:first-child{font-weight:800;width:38%}
.kpi td:last-child{color:var(--muted)}
.note-s{font-size:12.5px;color:var(--faint);margin-top:10px}

.nextp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;text-decoration:none;color:var(--ink);border-top:1.5px solid var(--ink);padding:36px 0 12px;margin-top:24px}
.nextp small{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--blue)}
.nextp b{display:block;font-size:clamp(30px,4.4vw,56px);font-weight:900;letter-spacing:-.055em;line-height:1.1;white-space:pre-line;margin-top:8px}
.nextp .go{width:72px;height:72px;grid-row:auto;grid-column:auto}
.nextp .go .arrow{width:28px;height:28px}
.nextp:hover .go{background:var(--blue);color:var(--on-blue)}
.prevp{display:inline-flex;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);text-decoration:none}

/* ───────── 이력서 ───────── */
.rs-top{display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.rs-photo{display:flex;flex-direction:column;gap:16px}
.rs-photo .ph{aspect-ratio:1;border-radius:24px}
.rs-photo dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:13.5px}
.rs-photo dt{font-weight:800;color:var(--blue);font-size:11.5px;letter-spacing:.12em;padding-top:2px}
.rs-photo dd{margin:0}
.rs-about h2{font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.04em;line-height:1.35;margin-bottom:16px}
.rs-about h2 em{font-style:normal;color:var(--blue)}
.rs-about .lede{margin-bottom:22px}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw span{font-size:13px;font-weight:700;border:1.5px solid var(--blue);color:var(--blue);border-radius:50%/60%;padding:8px 18px}
.rs-h{display:flex;align-items:center;gap:14px;margin:clamp(48px,6vw,72px) 0 20px}
.rs-h h3{font-size:13px;letter-spacing:.18em;font-weight:800;color:var(--blue)}
.rs-h .sum{font-size:13px;color:var(--muted);white-space:nowrap}
.xp{display:grid;grid-template-columns:240px minmax(0,1fr);gap:clamp(20px,3vw,40px);padding:28px 0;border-top:1.5px solid var(--ink)}
.xp+.xp{border-top:1px solid var(--line)}
.xp .when{font-family:var(--serif);font-size:20px;color:var(--blue);line-height:1.3}
.xp .co{font-size:22px;font-weight:900;letter-spacing:-.04em;margin-top:6px}
.xp .pos{font-size:13.5px;color:var(--muted);margin-top:2px}
.xp .dur{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 10px}
.xp .what{font-size:15px;margin-bottom:16px}
.xpj{display:flex;flex-direction:column}
.xpj a,.xpj div{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:14px;padding:11px 0;border-top:1px dashed var(--line);text-decoration:none;color:var(--ink);font-size:14px;align-items:baseline}
.xpj .w{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.xpj b{font-weight:800}
.xpj .s{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:1px}
.xpj .arrow{color:var(--blue);width:15px;height:15px}
.xpj a:hover b{color:var(--blue)}
.rs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.rs-box h4{font-size:13px;letter-spacing:.18em;font-weight:800;color:var(--blue);margin-bottom:12px;padding-bottom:10px;border-bottom:1.5px solid var(--ink)}
.rs-box ul{list-style:none;margin:0;padding:0}
.rs-box li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rs-box li .w{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.rs-box li .s{display:block;font-size:12.5px;color:var(--muted)}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.skills{grid-template-columns:minmax(0,1fr)}}
.skill{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.skill b{display:block;font-size:15px;font-weight:800;margin-bottom:10px}
.skill .chips span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}

/* ───────── 반응형 ───────── */
@media (max-width:1100px){
  .pc-mid,.pc-band{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pc-vis{grid-column:1/-1;grid-row:2;margin-bottom:-160px;max-width:560px;justify-self:center;width:100%}
  .pc-logo{grid-column:2;grid-row:1}
  .pc-mid::before{top:24%}
  .pc-band{padding-top:190px}
  .pc-sum{grid-column:2}
  .layers{grid-template-columns:minmax(0,1fr)}
  .layer:nth-child(n){margin-top:0}
  .rules{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  :root{--rail:0px}
  .rail{display:none}
  .hero,.cloudwrap,.contact .wrap,.rs-top,.xp,.psec{grid-template-columns:minmax(0,1fr)}
  .hero-vis{min-height:420px}
  .proc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cap{min-height:280px;border-radius:120px}
  .cap:nth-child(2)::after{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:24px}
  .stat:nth-child(3){border-left:0}
  .manual,.rs-grid{grid-template-columns:minmax(0,1fr)}
  .rs-photo{flex-direction:row;align-items:flex-start}
  .rs-photo .ph{width:140px;flex:none}
  .phero{grid-template-columns:minmax(0,1fr)}
  .phero aside{align-items:flex-start;text-align:left}
  .contact .stamp{display:none}
}
@media (max-width:640px){
  .topnav .wrap{height:auto;flex-wrap:wrap;padding-block:10px;gap:8px 12px}
  .links{order:3;width:100%;margin-left:0;overflow-x:auto;justify-content:space-between}
  .links a{padding:6px 8px;font-size:12px}
  .cta{display:none}
  .iconbtn{margin-left:auto}
  .hero-vis{min-height:360px}
  .stamp{width:100px;height:100px}
  .floatcard{max-width:190px;font-size:12px}
  .proc{grid-template-columns:minmax(0,1fr)}
  .cap{min-height:0;border-radius:40px;padding:24px 22px;flex-direction:row;flex-wrap:wrap;text-align:left;align-items:baseline;gap:4px 12px}
  .cap b{margin-top:0}
  .cap span{width:100%}
  .cap i{margin-top:6px;width:100%}
  .cap:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-15px;transform:translateX(-50%)}
  .cap:nth-child(2)::after{display:block}
  .rules,.gallery{grid-template-columns:minmax(0,1fr)}
  .pc-top{flex-direction:column}
  .pc-top .r{text-align:left}
  .pc-mid,.pc-band{grid-template-columns:minmax(0,1fr);min-height:0}
  .pc-mid::before{display:none}
  .pc-logo{grid-column:1;grid-row:auto;justify-self:start;padding-left:0;width:180px;order:1}
  .pc-vis{grid-row:auto;margin-bottom:-90px;order:2}
  .pc-band{padding:120px 22px 40px;border-radius:32px 32px 0 0}
  .pc-sum{grid-column:1}
  .phones{height:400px}
  .phone{width:150px}
  .phone.a{left:8%;top:90px}
  .phone.b{right:2%}
  .sheets{height:340px}
  .ticket{grid-template-columns:minmax(0,1fr)}
  .ticket .mid{border-left:0;border-top:2px dashed var(--line);padding:6px 0}
  .ticket .mid svg{transform:rotate(90deg)}
  .rowlist .r{grid-template-columns:minmax(0,1fr);gap:2px}
  .xpj a,.xpj div{grid-template-columns:minmax(0,1fr) auto}
  .xpj .w{grid-column:1/-1}
  .rs-box li{grid-template-columns:minmax(0,1fr);gap:0}
  .rs-photo{flex-direction:column}
  .nextp .go{width:52px;height:52px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
}
@media print{
  .rail,.topnav,.contact,.noprint,.marquee{display:none!important}
  .main{margin:0}
  body{background:#fff;color:#000}
  .rv{opacity:1;transform:none}
  .xp,.rs-box{break-inside:avoid}
}
</style>

  <div class="bot"><span class="vt">OPEN TO NEW OPPORTUNITIES · 2026</span><div class="barcode"></div></div>

<div class="main">
  <header class="topnav">
    <div class="wrap">
      <a class="logo" href="#home"><svg class="star" viewBox="0 0 24 24"><path d="M12 1v22M1 12h22M4.2 4.2l15.6 15.6M19.8 4.2 4.2 19.8"/></svg><span>홍선미<small>PORTFOLIO</small></span></a>

</div>

<script>
/* ═════════════════════════════════════════════
   설정
   - DRAFT: true면 주황색 [확인 필요] 표시가 보여요. 다 채우면 false로 바꾸세요.
   - 사진: images/ 폴더에 파일을 넣고, 아래 데이터의 사진 자리에 경로를 적으면 들어가요.
     예) ME.photo = 'images/profile.jpg'
         photos:[['가이드 메인 화면','16/9','wide','images/ibk-main.png'], ...]
         thumb:'images/ibk-thumb.png'  (목록 카드 썸네일)
         logo:'images/ibk-logo.png'    (커버 오른쪽 클라이언트 로고)
   ═════════════════════════════════════════════ */
const DRAFT = true;
const ME = {
  photo:'',
  email:'seonmihong69@gmail.com',
  linkedin:'', // 'https://www.linkedin.com/in/...'
};

const F = t => DRAFT ? `<span class="flag">${t ? '확인 필요 · ' + t : '확인 필요'}</span>` : '';
const STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1v22M1 12h22M4.2 4.2l15.6 15.6M19.8 4.2 4.2 19.8"/></svg>';

const ym = s => { const [y, m] = s.split('.').map(Number); return y * 12 + m - 1; };
const nowYM = (() => { const d = new Date(); return d.getFullYear() * 12 + d.getMonth(); })();
const months = c => (c.to ? ym(c.to) : nowYM) - ym(c.from) + 1;
const dur = m => `${Math.floor(m / 12) ? Math.floor(m / 12) + '년 ' : ''}${m % 12 ? m % 12 + '개월' : ''}`.trim();
const totalMonths = CAREER.filter(c => !c.side).reduce((a, c) => a + months(c), 0);

const shead = (en, more = '') => `<div class="shead"><span class="kick">${STAR}${en}</span><span class="sline"></span>${more}</div>`;
const pad = i => String(i + 1).padStart(2, '0');

/* 커버 목업에 쓰는 사진: 모바일은 세로 화면(9:…) 사진 최대 2장, 그 외는 첫 장 */
const mockShots = p => p.device === 'mobile' ? p.photos.filter(x => x[1].startsWith('9/')).slice(0, 2) : p.photos.slice(0, 1);
function mock(p){
  const shots = mockShots(p), a = shots[0] || p.photos[0], b = shots[1] || [a[0] + ' 2', a[1], '', ''];
  if (p.device === 'mobile') return `<div class="phones">
      <div class="phone a"><div class="scr">${fill(b[0], b[3])}</div></div>
      <div class="phone b"><div class="scr">${fill(a[0], a[3])}</div></div></div>`;
  if (p.device === 'doc') return `<div class="sheets">
      <div class="sheet s1">${fill('장표 2', '')}</div><div class="sheet s2">${fill('장표 3', '')}</div>
      <div class="sheet s3">${fill(a[0], a[3])}</div></div>`;
  return `<div class="browser"><div class="bar"><i></i><i></i><i></i></div><div class="scr">${fill(a[0], a[3])}</div></div>`;
}

function tile(p, i){
  const art = p.thumb ? ph(p.title, '4/3', '', p.thumb)
    : `<span class="tile-no">${pad(i)}</span><span class="tile-head">${p.head}</span>${DRAFT ? '<span class="tile-hint">썸네일 자리</span>' : ''}`;
  return `<a class="tile t${i % 3} rv" href="#${p.id}" data-cats="${p.cat.join(',')}">
    <div class="tile-art">${art}</div>
    <div class="tile-meta"><div class="cats">${p.cat.map(c => `<span class="tag">${c}</span>`).join('')}</div>
      <h3>${p.title}</h3><p>${p.org.split(' · ').pop()} · ${p.when}</p><span class="go">${ARROW}</span></div></a>`;
}

function note(e, i){
  const r = [-1.6, 1.2, -.6, 1.8, -1.1, .7][i % 6], tr = [-4, 3, -2, 5][i % 4];
  const tagName = e.link ? 'a' : 'article';
  return `<${tagName} class="note rv" ${e.link ? `href="#${e.link}"` : ''} data-type="${e.type}" style="--r:${r}deg;--tr:${tr}deg">
    <div class="top"><time>${e.d}</time><span class="tag">${e.type}</span></div>
    <h3>${e.t}</h3><p>${e.x}</p>
    ${e.photo ? ph(e.photo, '4/3', '', e.src) : ''}

    ${e.link ? `<span class="lk">프로젝트 보기 ${ARROW}</span>` : ''}</${tagName}>`;
}

      <div><p class="what">${c.what}</p>${pj.length ? `<div class="xpj">${pj.map(x => x.id

/* ═════════════ 프로젝트 소개 페이지 ═════════════ */
function projectPage(p){
  const i = P.indexOf(p), next = P[(i + 1) % P.length], prev = P[(i - 1 + P.length) % P.length];
  const personal = p.cat.includes('개인·학교');
  let n = 0;
  const sec = (en, ko, body) => `<section class="psec rv"><header><span class="n">${String(++n).padStart(2, '0')}</span><h2>${ko}</h2><small>${en}</small></header><div>${body}</div></section>`;
  const used = mockShots(p), gal = p.photos.filter(x => !used.includes(x));
  let h = `
  <section class="pcover">
    <div class="wrap">
      <div class="pc-top"><span>HONG SEONMI ©</span><span class="r">${p.when.slice(0, 4)} Portfolio ${personal ? 'Personal Work' : 'Client Work'}<br>${p.service}</span></div>
      <div class="pc-mid">
        <div class="pc-title"><h1>${p.head}</h1><p>${p.title}</p></div>
        <div class="pc-vis">${mock(p)}</div>
        <div class="pc-logo">${ph(p.org.split(' · ').pop() + ' 로고', '5/2', '', p.logo)}</div>
      </div>
    </div>
    <div class="wrap" style="padding-inline:0">
      <div class="pc-band">
        <div class="pc-detail"><h3>PROJECT DETAIL</h3>
          <dl><dt>CLIENT</dt><dd>${p.org}</dd><dt>PERIOD</dt><dd>${p.when}</dd><dt>ROLE</dt><dd>${p.role}</dd><dt>TEAM</dt><dd>${p.team}</dd></dl>
          <div class="chips">${p.cat.map(c => `<span class="tag">${c}</span>`).join('')}</div></div>
        <div class="pc-sum"><h2>${p.title}</h2><p>${p.lede}</p></div>
      </div>
    </div>
  </section>
  <div class="pbody">`;
  if (p.problem) h += sec('PROBLEM', '문제', `<div class="prose">${p.problem.map(x => `<p>${x}</p>`).join('')}</div>`);
  if (p.decision) h += sec('DECISION', '판단 기록', `<div class="ticket">
      <div><small>FROM · 처음 본 것</small><span class="code">BEFORE</span><p>${p.decision.first}</p></div>
      <div class="mid">${PLANE}</div>
      <div class="to"><small>TO · 파고들어 보니</small><span class="code">AFTER</span><p>${p.decision.then}</p><span class="barcode"></span></div></div>`);
  h += sec('PROCESS', '과정', `<ol class="flow">${p.steps.map(s => `<li><b>${s[0]}</b><span>${s[1]}</span></li>`).join('')}</ol>`);
  if (gal.length) h += `<div class="gallery rv">${gal.map((x, k) => { const wide = x[2] === 'wide' || (gal.length % 2 && k === 0); return ph(x[0], wide ? '16/9' : x[1].startsWith('9/') ? '4/3' : x[1], wide ? 'wide' : '', x[3]); }).join('')}</div>`;
  if (p.outs) h += sec('RESULT', '결과', `<div class="outs">${p.outs.map(o => `<div class="out"><b>${o[0]}</b><span>${o[1]}</span></div>`).join('')}</div>${DRAFT ? `<p class="note-s">성과 수치 ${F()}</p>` : ''}`);
  if (p.ai) h += sec('AI', 'AI를 쓴 곳', `<div class="aibox"><h3>${STAR}이 프로젝트에서 AI에게 맡긴 일</h3><ul>${p.ai.map(a => `<li>${a}</li>`).join('')}</ul></div>`);
  if (p.kpi) h += sec('NEXT METRICS', '출시 후 볼 지표', `<div class="kpi"><header>이 서비스를 계속 맡는다면 볼 지표<span>제안 · 실제 측정 아님</span></header><table>${p.kpi.map(k => `<tr><td>${k[0]}</td><td>${k[1]}</td></tr>`).join('')}</table></div>`);
  h += `<a class="nextp" href="#${next.id}"><div><small>NEXT PROJECT</small><b>${next.head}</b></div><span class="go">${ARROW}</span></a>
    <a class="prevp" href="#${prev.id}">← 이전 · ${prev.title}</a> &nbsp; <a class="prevp" href="#work">모든 프로젝트 보기</a></div>`;
  return h;
}

/* ═════════════ 라우팅 ═════════════ */
const page = document.getElementById('page');
let io;
function reveal(){
  if (io) io.disconnect();
  const els = page.querySelectorAll('.rv');
  if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin:'0px 0px -8% 0px' });
  els.forEach(e => io.observe(e));
}
function bindChips(attr, sel){
  const chips = [...page.querySelectorAll(`.chip[data-${attr}]`)];
  chips.forEach(ch => ch.addEventListener('click', () => {
    chips.forEach(c => c.setAttribute('aria-pressed', c === ch));
    const v = ch.dataset[attr];
    page.querySelectorAll(sel).forEach(el => {
      const vals = (el.dataset.cats || el.dataset.type).split(',');
      el.hidden = !(v === '전체' || vals.includes(v));
      el.style.display = el.hidden ? 'none' : '';
    });
  }));
}
function render(){
  const id = (location.hash || '#home').slice(1);
  const proj = P.find(p => p.id === id);
  page.innerHTML = proj ? projectPage(proj) : (PAGES[id] || PAGES.home)();
  const cur = proj ? 'work' : (PAGES[id] ? id : 'home');
  document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === cur ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.title = proj ? `${proj.title} · 홍선미` : '홍선미 · UX·서비스 기획자';
  if (cur === 'work' && !proj) bindChips('cat', '#tiles .tile');
  if (cur === 'log') bindChips('type', '#notes .note');
  window.scrollTo({ top:0, behavior:'instant' });
  reveal();
}
window.addEventListener('hashchange', render);

document.getElementById('themeBtn').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', r.dataset.theme); } catch (e) {}
});
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
render();
</script>
